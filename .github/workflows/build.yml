name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build EXE and installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build standalone EXE
        run: pyinstaller --noconsole --onefile --icon assets\icon.ico main.py

      - name: Build Windows installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\build-installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CImageOptimizer-build
          path: |
            dist/main.exe
            dist/CImageOptimizer-Setup.exe
          if-no-files-found: error
